name: Go Tests (latest + 2 prev)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  check-new-go:
    name: Check for Newer Go Release
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.compare.outputs.should_test }}
    steps:
      - name: Fetch latest stable Go version
        id: fetch
        run: |
          LATEST=$(curl -sSf https://go.dev/VERSION?m=text | head -n1 | sed 's/^go//')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable Go: $LATEST"

      - name: Compare versions
        id: compare
        run: |
          MATRIX_MAX="1.26"               # change on new version!! also the go matrix below!
          LATEST="${{ steps.fetch.outputs.latest }}"

          # Extract major.minor reliably (e.g., 1.25.7 → 1.25, 1.26.0 → 1.26)
          MATRIX_MM=$(echo "$MATRIX_MAX" | cut -d. -f1-2)
          LATEST_MM=$(echo "$LATEST" | cut -d. -f1-2)

          if [[ "$LATEST_MM" > "$MATRIX_MM" ]]; then
            echo "::warning::Newer Go major/minor $LATEST detected (matrix max major/minor is $MATRIX_MM). Consider updating the matrix."
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "Go version OK (latest $LATEST has same or lower major/minor than matrix max $MATRIX_MM)"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.suite.name }} - Go ${{ matrix.go }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check-new-go
    if: ${{ needs.check-new-go.outputs.should_test == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        go: ['stable']
        os: [ubuntu-latest, windows-latest]
        suite:
          - { name: "Unit", dir: "./...", tags: "", pattern: "" }
          - { name: "Integration", dir: "./tests/integration/...", tags: "integration", pattern: "" }
          - { name: "Regression", dir: "./tests/regression/...", tags: "regression", pattern: "" }
          - { name: "Stress", dir: "./tests/stress/...", tags: "", pattern: "" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Run ${{ matrix.suite.name }} tests
        run: |
          TAGS="${{ matrix.suite.tags }}"
          if [ -n "$TAGS" ]; then
            go test -v -race -tags="$TAGS" -parallel=4 ${{ matrix.suite.dir }}
          else
            go test -v -race -parallel=4 ${{ matrix.suite.dir }}
          fi

  e2e:
    name: E2E - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: check-new-go
    if: ${{ needs.check-new-go.outputs.should_test == 'true' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: "ground truth", run: "^TestVerifyMutations_GroundTruth$", skip: "" }
          - { name: "score validation", run: "^TestWorkflow_OverallScoreValidation$", skip: "" }
          - { name: "no mutants lost", run: "^TestWorkflow_NoMutantsLost$", skip: "" }
          - { name: "rest", run: "", skip: "^(TestVerifyMutations_GroundTruth|TestWorkflow_OverallScoreValidation|TestWorkflow_NoMutantsLost)$" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download modules
        run: go mod download

      - name: Run E2E tests (${{ matrix.shard.name }})
        env:
          GORGON_VERIFY_MAX: "0"
        run: |
          ARGS=(-v -count=1 -timeout=55m -tags=e2e)
          if [ -n "${{ matrix.shard.run }}" ]; then ARGS+=(-run "${{ matrix.shard.run }}"); fi
          if [ -n "${{ matrix.shard.skip }}" ]; then ARGS+=(-skip "${{ matrix.shard.skip }}"); fi
          go test "${ARGS[@]}" ./tests/e2e/...
